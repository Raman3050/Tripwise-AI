server:
  port: ${PORT:8080}
  error:
    include-message: always

spring:
  application:
    name: tripwise-api
  jackson:
    default-property-inclusion: non_null
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/tripwisedb;AUTO_SERVER=TRUE}
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  frontend-origin: ${FRONTEND_ORIGIN:https://tripwise-ai-kappa.vercel.app,https://*.vercel.app,http://localhost:5173}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  geoapify:
    api-key: ${GEOAPIFY_API_KEY:}
    base-url: https://api.geoapify.com
  groq:
    api-key: ${GROQ_API_KEY:}
    model: ${GROQ_MODEL:openai/gpt-oss-120b}
    base-url: https://api.groq.com/openai/v1

logging:
  level:
    com.tripwise.api: INFO
